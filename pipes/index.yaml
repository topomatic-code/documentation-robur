title: 'Топоматик Robur - Инженерные сети'
blocks:
  - type: 'card-layout-block'
    title: 'Топоматик Robur - Инженерные сети'
    description:
     <p>
     В данном томе рассматривается функционал по созданию и редактированию наружных инженерных сетей. Описываются блоки дополнительных задач, применимых при проектировании инженерных сетей (работа с библиотеками данных, формирование выходной документации и т.д.).
     <p>
     Общие бщие принципы работы в модуле "Инженерные сети" также приведены в <a href="https://rutube.ru/plst/522418?r=wd">"Кратком учебном видеокурсе"</a>.
     <p>
     Вопросы, связанные с подготовкой исходных данных, такие как <a href="ru/rb_survey/survey/basic_concepts.html">обработка геодезических данных</a> и <a href="ru/rb_survey/glg/creation_legend_ground.html">геологических данных</a>, <a href="ru/rb_survey/dtm/general_information.html">работа с ЦММ</a>, импорт данных из других программных приложений подробно рассматривались в предыдущих томах.
    animated: true
