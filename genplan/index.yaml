title: 'Топоматик Robur - Генеральные планы'
blocks:
  - type: 'card-layout-block'
    title: 'Топоматик Robur - Генеральные планы'
    description: >-
      <p>
      В данном томе рассматривается функционал по созданию и редактированию элементов генерального плана. Описываются блоки дополнительных задач, применимых при работе с моделью Площадка (Расстановка элементов озеленения, малых архитектурных форм, работа с библиотеками данных, формирование выходной документации и т.д.). Вопросы, связанные с подготовкой исходных данных, такие как: <a href="ru/rb_survey/survey/basic_concepts.html">обработка геодезических</a> и <a href="ru/rb_survey/glg/creation_legend_ground.html">геологических данных</a>, <a href="ru/rb_survey/dtm/general_information.html">работа с ЦММ </a> подробно рассматривались в предыдущих разделах.
      <p>
      Общие принципы работы в модуле "Генеральные планы" приведены в учебном видеокурсе в <a href="https://www.youtube.com/playlist?list=PL8nBWfOCF6qJinJgqjH69FUnnADsmkfEQ">YouTube</a>|<a href="https://rutube.ru/plst/862519">RuTube</a>|<a href="https://vkvideo.ru/playlist/-31725289_16">VK</a>
