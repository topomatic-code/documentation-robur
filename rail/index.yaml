title: 'Топоматик Robur - Железные дороги'
blocks:
  - type: 'card-layout-block'
    title: 'Топоматик Robur - Железные дороги'
    description:
     <p>
     В данном разделе рассматривается функционал по созданию и редактированию проектного продольного и поперечного профиля железной дороги. Описываются блоки дополнительных задач, также применимых при проектировании железных дорог (узлы и станции, выправка пути, распределение земляных масс и т.д.).
     <p>
     Вопросы связанные с подготовкой исходных данных, такие как <a href="ru/rb_survey/survey/basic_concepts.html">обработка геодезических</a> и <a href="ru/rb_survey/glg/creation_legend_ground.html">геологических данных</a>, <a href="ru/rb_survey/dtm/general_information.html">работа с ЦММ </a>, импорт данных из других программных приложений, а также функционал по работе с <a href="ru/rb_survey/alg/general_information.html">планом трассы и черными профилями</a> подробно рассматривались в предыдущих резделах.
