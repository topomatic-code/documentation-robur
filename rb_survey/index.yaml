title: 'Топоматик Robur - Изыскания'
blocks:
  - type: 'card-layout-block'
    title: 'Топоматик Robur - Изыскания'
    description:  >-
     В разделе рассматриваются вопросы создания и редактирования цифровой модели местности (ЦММ), оформление топографических планов и формирования чертежей планшетов.
     <p>
     Описан функционал работы с планом трассы (как существующей, так и проектируемой), а также основные способы формирования «черных» профилей и поперечников.
     <p>
     Рассмотрен функционал работы с геодезическими данными —загрузка их измерений, обработка и формирование выходной документации, а также вопросы создания и редактирования геологических данных – библиотеки грунтов и выработок, основные механизмы нанесения геологических разрезов на профили, формирования выходных чертежей и ведомостей.
     </p>
