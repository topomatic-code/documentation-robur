title:
  - Редактор сопряжений
description: >-
    <p>
    Модуль плановых построений (меню <b>Рисовать - Построения</b>) предназначен, в первую очередь, для проектирования развязок в разных уровнях. 
    В основе модуля лежат усовершенствованные алгоритмы, разработанные на основе обобщения опыта автоматизированного проектирования многоуровневых развязок и одноуровневых пересечений.
    <p>
    Модуль плановых построений имеет следующие преимущества :
    <ul>
    <li>Сопрягаться могут как отдельные примитивы, так и комплексные линии, состоящие из множества сопряженных отрезков, дуг и клотоид. В последнем случае программа автоматически определяет, на какой из элементов попадает точка сопряжения.</li>
    <li>Выполняется автоматический подбор первого приближения.</li>
    <li>Имеется возможность визуально (при помощи мыши) редактировать параметры сопряжения.</li>
    <li>Если сопрягаются окружности, то могут применяться усеченные клотоиды.</li>
    <li>Данный функционал позволяет рассчитывать соединительные кривые право- и левоповоротных рамп практически любого очертания в плане.</li>
    </ul> 
    <p>
    Результаты работы модуля плановых построений используются для создания осей и увязки геометрических параметров съездов, а также для назначения поперечных уклонов в зонах ответвления (примыкания) при помощи функционала Robur.
    <p>
    Основные функции данной группы сводятся к добавлению примитивов определенного типа (арки, клотоиды, прямые) или сопряжению их заданной комбинацией элементов. Описание команд данной группы представлено ниже.
meta:
  title: Редактор сопряжений
  description: >-
    Модуль плановых построений (Меню Рисовать - Построения) предназначен, в первую очередь, для проектирования развязок в разных уровнях. 
    В основе модуля лежат усовершенствованные алгоритмы, разработанные на основе обобщения опыта автоматизированного проектирования многоуровневых развязок и одноуровневых пересечений.

    Модуль плановых построений имеет следующие преимущества :
    * Сопрягаться могут как отдельные примитивы, так и комплексные линии, состоящие из множества сопряженных отрезков, дуг и клотоид. В последнем случае программа автоматически определяет, на какой из элементов попадает точка сопряжения.
    * Выполняется автоматический подбор первого приближения.
    * Имеется возможность визуально (при помощи мыши) редактировать параметры сопряжения.
    * Если сопрягаются окружности, то могут применяться усеченные клотоиды.
    * Данный функционал позволяет рассчитывать соединительные кривые право- и левоповоротных рамп практически любого очертания в плане.

    Результаты работы модуля плановых построений используются для создания осей и увязки геометрических параметров съездов, а также для назначения поперечных уклонов в зонах ответвления (примыкания) при помощи функционала Robur.

    Основные функции данной группы сводятся к добавлению примитивов определенного типа (арки, клотоиды, прямые) или сопряжению их заданной комбинацией элементов. Описание команд данной группы представлено ниже.
